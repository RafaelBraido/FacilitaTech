<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - FacilitaTech</title>
<style>
  * { box-sizing: border-box; }
  html { font-size: calc(16px * var(--font-scale, 1)); }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f3f4f6; font-family: Arial, sans-serif;
  }
  .card { display: flex; width: 100%; max-width: 64rem; background: #fff; border-radius: 0.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.12); overflow: hidden; margin: 1rem; }
  .brand { width: 50%; background: #4338ca; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2.5rem; text-align: center; }
  .brand h1 { font-size: 1.9rem; font-weight: 700; margin: 0 0 0.5rem; }
  .brand p { font-size: 1.1rem; margin: 0; }
  .form-side { width: 50%; padding: 2.5rem; }
  .form-side h2 { font-size: 1.5rem; font-weight: 600; color: #1f2937; text-align: center; margin: 0 0 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.9rem; font-weight: 700; color: #374151; margin-bottom: 0.4rem; }
  .field input {
    width: 100%; padding: 0.6rem 1rem; border: 1px solid #d1d5db; border-radius: 0.4rem;
    font-size: 1rem; font-family: inherit;
  }
  .field input:focus { outline: none; box-shadow: 0 0 0 2px #6366f1; border-color: #6366f1; }
  .btn-entrar {
    width: 100%; background: #4f46e5; color: #fff; border: none; padding: 0.85rem 1.2rem;
    border-radius: 0.4rem; font-weight: 700; font-size: 1.1rem; cursor: pointer;
  }
  .btn-entrar:hover { background: #4338ca; }
  .btn-entrar:disabled { opacity: 0.7; cursor: not-allowed; }
  .rodape { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
  .rodape a { color: #4f46e5; font-weight: 700; text-decoration: none; }
  .msg { display: none; margin-bottom: 1rem; padding: 0.75rem; border-radius: 0.4rem; font-size: 0.9rem; font-weight: 700; }
  .msg.show { display: block; }
  .msg.erro { background: #fee2e2; color: #b91c1c; }

  .text-size-widget {
    position: fixed; right: 1.2rem; bottom: 1.2rem;
    background: #fff; border: 2px solid #4338ca; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    display: flex; align-items: center; gap: 0.3rem; padding: 0.4rem; z-index: 200;
  }
  .text-size-widget button {
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: #eef2ff; color: #3730a3; font-weight: 700; font-size: 1.1rem; cursor: pointer;
  }
  .text-size-widget button:hover { background: #4338ca; color: #fff; }
  .text-size-widget .label { font-size: 0.8rem; font-weight: 700; color: #555; padding: 0 0.4rem; white-space: nowrap; }

  @media (max-width: 640px) {
    .card { flex-direction: column; }
    .brand, .form-side { width: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>FacilitaTech</h1>
      <p>Tutoriais simples de tecnologia, no seu tempo</p>
    </div>
    <div class="form-side">
      <h2>Entrar</h2>
      <div id="login-message" class="msg erro"></div>
      <form id="login-form">
        <div class="field">
          <label for="nome">Nome</label>
          <input id="nome" type="text" autocomplete="name" maxlength="60" required autofocus>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-submit" class="btn-entrar">Entrar</button>
      </form>
      <p class="rodape">Ainda não tem conta? <a href="index.html">Criar conta</a></p>
    </div>
  </div>

<script>
  const API_BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
    ? "http://localhost:3000"
    : "https://facilitatech.onrender.com";

  async function apiRequest(path, { method = "GET", body } = {}) {
    let response;
    try {
      response = await fetch(`${API_BASE_URL}${path}`, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (_) {
      throw new Error("Não foi possível falar com o servidor. Verifique sua internet.");
    }
    let data = null;
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) {
      throw new Error((data && (data.message || data.error)) || "Algo deu errado. Tente de novo.");
    }
    return data;
  }

  async function loginUser(payload) {
    const resposta = await apiRequest("/auth/login", { method: "POST", body: payload });
    return resposta.data;
  }

  const FONT_SCALES = [1, 1.15, 1.3, 1.5, 1.7];
  const FONT_SCALE_KEY = "ft_font_scale_index";
  function applyFontScale(index) {
    document.documentElement.style.setProperty("--font-scale", FONT_SCALES[index]);
    localStorage.setItem(FONT_SCALE_KEY, index);
    const label = document.getElementById("ft-font-scale-label");
    if (label) label.textContent = `Letra ${Math.round(FONT_SCALES[index] * 100)}%`;
  }
  (function initTextSizeWidget() {
    const widget = document.createElement("div");
    widget.className = "text-size-widget";
    widget.innerHTML = `
      <button type="button" id="ft-font-decrease" aria-label="Diminuir tamanho da letra">A-</button>
      <span class="label" id="ft-font-scale-label">Letra 100%</span>
      <button type="button" id="ft-font-increase" aria-label="Aumentar tamanho da letra">A+</button>
    `;
    document.body.appendChild(widget);
    const saved = parseInt(localStorage.getItem(FONT_SCALE_KEY), 10);
    let index = Number.isInteger(saved) && saved >= 0 && saved < FONT_SCALES.length ? saved : 0;
    applyFontScale(index);
    document.getElementById("ft-font-increase").addEventListener("click", () => {
      index = Math.min(index + 1, FONT_SCALES.length - 1);
      applyFontScale(index);
    });
    document.getElementById("ft-font-decrease").addEventListener("click", () => {
      index = Math.max(index - 1, 0);
      applyFontScale(index);
    });
  })();

  if (localStorage.getItem("ft_token")) {
    window.location.href = "index.html";
  }

  const form = document.getElementById("login-form");
  const message = document.getElementById("login-message");
  const submitBtn = document.getElementById("login-submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    message.className = "msg erro";
    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando...";
    try {
      const nome = document.getElementById("nome").value.trim();
      const password = document.getElementById("password").value;
      const data = await loginUser({ nome, password });

      if (data.token) localStorage.setItem("ft_token", data.token);
      if (data.user) {
        if (data.user._id) localStorage.setItem("ft_user_id", data.user._id);
        if (data.user.nome) localStorage.setItem("ft_user_nome", data.user.nome);
        if (data.user.role) localStorage.setItem("ft_user_role", data.user.role);
      }
      window.location.href = "index.html";
    } catch (err) {
      message.textContent = err.message;
      message.className = "msg erro show";
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
